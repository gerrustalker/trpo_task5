<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
                padding: 0; margin: 0;
                color: white;
                font-family: Consolas, 'Courier New', Courier, monospace;
            }

            body {
                background-color: rgb(25, 25, 25);
                width: 100vw;
                height: 100vh;
                padding: 1em;
            }

            form {
                margin-top: 1em;
                display: flex;
                flex-direction: column;
                gap: .25em;
            }

            label {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                width: 15vw;
            }

            input, select, option {
                border: none;
                outline: none;
                background-color: black;
                width: 75%;
                padding: .25em .5em;
            }
        </style>
    </head>
    <body>
        <h1>openweathermap stuff</h1>
        <form>
            <label>city: <input type="text" name="city"></label>
            <label>mode: <select name="mode"><option selected>current</option><option>hourly</option><option>daily</option></select></label>
        </form>
        <main id="showmain">

        </main>
    </body>
</html>
