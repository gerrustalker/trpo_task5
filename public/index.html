<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            form {
                display: flex;
                flex-direction: column;
                gap: .25em;
                width: 300px;
                max-width: 300px;
                text-wrap: wrap;
                flex-wrap: wrap;
            }
            label {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <h1>/auth/register</h1>
        <form id="regform">
            <label>username <input type="text" name="username" id="username"></label>
            <label>email <input type="email" name="email" id="email"></label>
            <label>password <input type="password" name="password" id="password"></label>
            <button>submit</button>
            <pre class="message"></pre>
        </form>

        <h1>/auth/login</h1>
        <form id="loginform">
            <label>email <input type="email" name="email" id="email"></label>
            <label>password <input type="password" name="password" id="password"></label>
            <button>submit</button>
            <pre class="message"></pre>
        </form>

        <h1>/users/get</h1>
        <form id="ugetform">
            <label>user <input type="number" name="user" id="user"></label>
            <label>jwt <input type="password" name="password" id="password"></label>
            <button>submit</button>
            <pre class="message"></pre>
        </form>
    </body>
    <script>
        regform.addEventListener("submit", event => {
            event.preventDefault()
            fetch("/auth/register", {
                method: "POST",
                body: JSON.stringify(Array.from((new FormData(event.target)).entries()).reduce((memo, [key, value]) => ({...memo, [key]: value}), {})),
                headers: {"Content-Type": "application/json"}
            }).then(async res => {
                const data = await res.text()
                event.target.querySelector(".message").textContent = data
            }).catch(err => {event.target.querySelector(".message").textContent = err})
        })

        loginform.addEventListener("submit", event => {
            event.preventDefault()
            fetch("/auth/login", {
                method: "POST",
                body: JSON.stringify(Array.from((new FormData(event.target)).entries()).reduce((memo, [key, value]) => ({...memo, [key]: value}), {})),
                headers: {"Content-Type": "application/json"}
            }).then(async res => {
                const data = await res.text()
                event.target.querySelector(".message").textContent = data
            }).catch(err => {event.target.querySelector(".message").textContent = err})
        })

        ugetform.addEventListener("submit", event => {
            event.preventDefault()
            const fd = new FormData(event.target)
            fetch("/users/" + fd.get("user"), {
                method: "GET",
                headers: {"Content-Type": "application/json", "Authorization": "Bearer " + fd.get("password")}
            }).then(async res => {
                const data = await res.text()
                event.target.querySelector(".message").textContent = data
            }).catch(err => {event.target.querySelector(".message").textContent = err})
        })
    </script>
</html>
