        <style>
            * {
                margin: 0; padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 100vw;
                max-height: 100vh;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                gap: 1em;
                padding: 1em;
            }

            form {
                display: flex;
                flex-direction: column;
                gap: .25em;
                width: 300px;
                max-width: 300px;
                text-wrap: wrap;
                flex-wrap: wrap;
                flex-shrink: 1;
            }

            label {
                display: flex;
                justify-content: space-between;
            }

            textarea {
                width: 300px;
                overflow: auto;
            }
        </style>
    </head>

    <script>
        [
            {
                path: "/auth/register",
                entries: [
                    {name: "username", type: "text"},
                    {name: "email", type: "email"},
                    {name: "password", type: "password"},
                ]
            },
            {
                path: "/auth/login",
                entries: [
                    {name: "email", type: "email"},
                    {name: "password", type: "password"},
                ]
            },
            {
                path: "/users/",
                param: "user",
                method: "GET",
                entries: [
                    {name: "user", type: "number"},
                    // {name: "jwt", type: "password"},
                ]
            },
            {
                path: "/products/",
                param: "user",
                method: "GET",
                entries: [
                    {name: "user", type: "number"},
                    // {name: "jwt", type: "password"},
                ]
            },
        ].forEach(el => {
            let form = document.createElement("form")
                let h1 = document.createElement("h1")
                    h1.textContent = el.path
                form.appendChild(h1)
                el.entries.forEach(entry => {
                    let label = document.createElement("label")
                        label.textContent = entry.name
                        let input = document.createElement("input")
                            input.type = entry.type
                            input.name = entry.name
                            input.id = entry.name
                        label.appendChild(input)
                    form.appendChild(label)
                })
                let button = document.createElement("button")
                    button.textContent = "submit"
                form.appendChild(button)
                form.appendChild(button)
                form.addEventListener("submit", event => {
                    event.preventDefault()
                    const fd = new FormData(event.target)
                    fetch(el.path + (el.param ? fd.get(el.param) : ""), {
                        method: el.method ?? "POST",
                        body: el.method !== "GET" ? JSON.stringify(Array.from((fd).entries()).reduce((memo, [key, value]) => ({...memo, [key]: value}), {})) : null,
                        headers: {"Content-Type": "application/json"}
                    }).then(async res => {
                        const data = await res.text()
                        event.target.querySelector(".message").textContent = data
                    }).catch(err => {event.target.querySelector(".message").textContent = err})
                })
                let textarea = document.createElement("textarea")
                    textarea.classList.add("message")
                    textarea.setAttribute("disabled", "")
                form.appendChild(textarea)
            document.body.appendChild(form)
        })
